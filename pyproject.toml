[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idxavm"
version = "0.1.0"
description = "Independent Sacramento valuation data feasibility audit"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "pyarrow>=17,<24"]

[project.optional-dependencies]
geo = ["geopandas>=1,<2"]
model = ["scikit-learn>=1.5,<2", "lightgbm>=4,<5", "xgboost>=2,<4", "torch>=2,<3", "mlflow>=2,<4", "fastapi>=0.115,<1"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.13,<3"]

[project.scripts]
idxavm = "idxavm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idxavm"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

